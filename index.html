<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solar Urja ERP — solar.klyiatechnology.com</title>
    <meta name="description" content="Solar Urja ERP & CRM platform (solar.klyiatechnology.com) for solar EPC project workflow tracking, CRM, site survey, finance, HRMS, inventory, and O&M service management." />
    <meta property="og:title" content="Solar Urja ERP — solar.klyiatechnology.com" />
    <meta property="og:description" content="Solar Urja ERP & CRM platform (solar.klyiatechnology.com) for solar EPC project workflow tracking, CRM, site survey, finance, HRMS, inventory, and O&M service management." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased">
    <div id="root">
      <div id="solar-urja-preloader" style="min-height: 100vh; background-color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #0f2954; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 24px;">
        <div style="background: #ffffff; border: 1px solid #e2e8f0; border-radius: 20px; padding: 24px 32px; box-shadow: 0 12px 30px -12px rgba(15, 41, 84, 0.14); display: flex; flex-direction: column; align-items: center; text-align: center;">
          <img src="/assets/aistudio/solar_urja_logo_07b84efe.jpeg" alt="Solar Urja ERP" style="height: 56px; width: auto; object-fit: contain; margin-bottom: 14px;" />
          <div style="font-size: 16px; font-weight: 800; color: #0f2954; letter-spacing: -0.01em; margin-bottom: 4px;">Solar Urja ERP</div>
          <div style="font-size: 12px; font-weight: 600; color: #16a34a; margin-bottom: 14px;">solar.klyiatechnology.com</div>
          <div style="display: flex; align-items: center; gap: 8px; color: #475569; font-size: 13px; font-weight: 500;">
            <div style="width: 15px; height: 15px; border: 2px solid #f97316; border-top-color: transparent; border-radius: 50%; animation: solar-urja-spin 0.8s linear infinite;"></div>
            <span>Loading Solar Urja workspace...</span>
          </div>
        </div>
        <style>
          @keyframes solar-urja-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
          }
        </style>
      </div>
    </div>
    <script>
      window.addEventListener('error', function(e) {
        var pre = document.getElementById('solar-urja-preloader');
        if (pre) {
          console.error('[Production Loader Error]', e.error || e.message);
          var msg = (e && e.message) ? e.message : 'Unknown runtime script error';
          pre.innerHTML = '<div style="max-width: 420px; padding: 24px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; text-align: center; box-shadow: 0 12px 28px rgba(15, 41, 84, 0.1);">' +
            '<div style="color: #dc2626; font-size: 16px; font-weight: 700; margin-bottom: 8px;">Unable to load Solar Urja ERP</div>' +
            '<div style="color: #475569; font-size: 12px; margin-bottom: 16px; font-family: monospace; word-break: break-all;">' + msg + '</div>' +
            '<button onclick="try { window.localStorage && window.localStorage.clear(); } catch(err) {} window.location.reload();" style="padding: 8px 16px; background: #f97316; color: #ffffff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer;">Reload Application</button>' +
            '</div>';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
